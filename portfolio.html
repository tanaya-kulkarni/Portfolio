<title>Tanaya — Portfolio</title>
<style>
/* ===== FONT: Creato Display (files live in /fonts next to this HTML file) ===== */
@font-face{font-family:"Creato Display";font-weight:100;font-style:normal;font-display:swap;src:url("CreatoDisplay-Thin.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:300;font-style:normal;font-display:swap;src:url("CreatoDisplay-Light.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:400;font-style:normal;font-display:swap;src:url("CreatoDisplay-Regular.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:500;font-style:normal;font-display:swap;src:url("CreatoDisplay-Medium.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:700;font-style:normal;font-display:swap;src:url("CreatoDisplay-Bold.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:800;font-style:normal;font-display:swap;src:url("CreatoDisplay-ExtraBold.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:300;font-style:italic;font-display:swap;src:url("CreatoDisplay-LightItalic.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:400;font-style:italic;font-display:swap;src:url("CreatoDisplay-RegularItalic.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:500;font-style:italic;font-display:swap;src:url("CreatoDisplay-MediumItalic.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:700;font-style:italic;font-display:swap;src:url("CreatoDisplay-BoldItalic.otf") format("opentype")}
@font-face{font-family:"Creato Display";font-weight:800;font-style:italic;font-display:swap;src:url("CreatoDisplay-ExtraBoldItalic.otf") format("opentype")}

/* ===== DESIGN TOKENS / CONTROLS (all sizes in design px on a 1512px-wide canvas) ===== */
:root{
  --k:1;                         /* auto: viewport width / 1512 */
  /* typography */
  --font:"Creato Display",sans-serif;
  --heading-size:48px; --body-size:24px; --nav-size:24px; --intro-b-size:28px; --caption-size:22px; --cap-size:18px;
  /* colors */
  --bg:#FFFFFF; --hero-bg:rgba(169,228,252,.47); --tab-bg:#A8DAFF; --dash-color:#FFFFFF; --text:#000000; --nav-color:#545454;
  --dash:8px; --gap:8px;
  /* polaroid */
  --pad-t:10px; --pad-s:10px; --pad-b:48px; --img-r:12px; --frame-r:16px;
  --spread:0.87; --rot-mul:1;
     --pola-scale:0.88;
  /* hover */
  --hover-scale:1.06; --hover-rot:0; --hover-ms:300ms; --gray:1; --ov-opacity:1; --ov-strength:.9; --ov-height:75%; --cap-bottom:18px;
  /* shadow */
  --shadow-blur:18; --shadow-opacity:.35; --shadow-shift:10; --shadow-y:6;
  /* intro slide */
  --intro-interval:6000; --intro-delay:1200; --slide-ms:800ms;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(100px*var(--k))}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);overflow-x:hidden}

/* NAV */
.nav{position:sticky;top:0;z-index:100;height:calc(100px*var(--k));background:var(--bg);overflow:hidden}
#nav{width:1512px;height:100px;padding:30px 54px 0;display:flex;justify-content:space-between;transform:scale(var(--k));transform-origin:0 0}
#nav a{display:block;height:40px;line-height:40px;text-align:center;font-size:var(--nav-size);color:var(--nav-color);text-decoration:none;font-weight:400}
#nav a:hover{color:var(--text)}
#nav b{font-weight:inherit}
#nav a, #nav a span, #nav b{font-weight:400}
#nav a{width:calc(var(--nw)*1px)}
#nav .m{display:none}
.slot{left:calc(var(--dx)*1px);top:calc(var(--dy)*1px);width:calc(var(--dw)*1px);height:calc(var(--dh)*1px)}
.pola{--cx:var(--dcx);--cy:var(--dcy);--w:var(--dw);--h:var(--dh);--r:var(--dr);--sx:var(--dsx);--sy:var(--dsy)}
.w-div{display:none;width:1px;height:24px;background:#000;margin:0 10px}
/* nav underline */
:root{ --ul-color:#4570E1; --ul-thickness:3px; --ul-gap:4px; --ul-ms:250ms; }
#nav a span{display:inline-block;position:relative;line-height:1.2}
#nav a span::after{
  content:"";position:absolute;left:0;right:0;top:100%;
  margin-top:var(--ul-gap);height:var(--ul-thickness);
  background:var(--ul-color);border-radius:2px;
  transform:scaleX(0);transform-origin:left;
  transition:transform var(--ul-ms) ease;
}
#nav a.active span::after{transform:scaleX(1)}
/* STAGE (Figma coordinates; stage is shifted up 100px because the nav lives above it) */
.hero-wrap{position:relative;height:calc(882px*var(--k));overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1512px;height:982px;transform:scale(var(--k)) translateY(-100px);transform-origin:0 0}
.hero{position:absolute;left:0;top:100px;width:1512px;height:780px;background:var(--hero-bg)}
.tab{position:absolute;left:0;top:749px;width:1512px;height:130px;background:var(--tab-bg);z-index:60;box-shadow:0 -2px 6px rgba(0,0,0,.18)}
.dash{position:absolute;left:21px;top:786px;width:1468px;height:2px;z-index:61;background:repeating-linear-gradient(90deg,var(--dash-color) 0 var(--dash),transparent var(--dash) calc(var(--dash) + var(--gap)))}

/* SLOTS (placeholders for illustrations / SVGs) */
.slot{position:absolute;z-index:2;display:grid;place-items:center;text-align:center;padding:4px;border:2px dashed #4a76e8;background:rgba(255,255,255,.45);color:#4a76e8;font:12px/1.2 ui-monospace,Menlo,monospace}
.slot.filled{border:0;background:none;padding:0}
.slot img{width:100%;height:100%;object-fit:contain;display:block}

/* INTRO (slides up, loops) */
.intro{position:absolute;left:498px;top:140px;width:527px;height:166px;overflow:hidden;z-index:5}
.track{height:498px;transform:translateY(calc(var(--i,0)*-166px));transition:transform var(--slide-ms) cubic-bezier(.77,0,.18,1)}
.track.no-anim{transition:none}
.panel{position:relative;width:527px;height:166px}
.panel .hi{margin:0;height:40px;line-height:40px;text-align:center;font-size:var(--body-size);color:var(--text)}
.panel.b{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;padding:0 25px 0 60px;font-size:var(--intro-b-size);font-weight:400;line-height:1.1;gap:0}
.panel.b p{margin:0}
.panel.b p + p{margin-top:14px}
.note{position:absolute;left:73px;top:416px;width:140px;text-align:left;font-size:var(--caption-size);line-height:1.2;z-index:3}

/* POLAROIDS */
#polas{position:absolute;inset:0}
.pola{position:absolute;margin:0;cursor:pointer;z-index:10;
  width:calc(var(--w)*var(--pola-scale)*1px);height:calc(var(--h)*var(--pola-scale)*1px);
  left:calc((756 + (var(--cx) - 756)*var(--spread) - var(--w)*var(--pola-scale)/2)*1px);
  top:calc((560 + (var(--cy) - 560)*var(--spread) - var(--h)*var(--pola-scale)/2)*1px);
  padding:var(--pad-t) var(--pad-s) var(--pad-b);background:#fff;border-radius:var(--frame-r);
  transform:rotate(calc(var(--r)*var(--rot-mul)*1deg)) scale(1);
  transition:transform var(--hover-ms) cubic-bezier(.3,1.4,.5,1),box-shadow var(--hover-ms);
  box-shadow:calc(var(--sx)*var(--shadow-shift)*1px) calc((var(--shadow-y) + var(--sy)*var(--shadow-shift))*1px) calc(var(--shadow-blur)*1px) rgba(0,0,0,var(--shadow-opacity))}
.pola.active{z-index:50;transform:rotate(calc((var(--r)*var(--rot-mul) + var(--hover-rot))*1deg)) scale(var(--hover-scale));
  box-shadow:calc(var(--sx)*var(--shadow-shift)*1.5px) calc((var(--shadow-y) + var(--sy)*var(--shadow-shift))*1.5px) calc(var(--shadow-blur)*1.6px) rgba(0,0,0,var(--shadow-opacity))}
.img{position:relative;width:100%;height:100%;overflow:hidden;border-radius:var(--img-r);background:#ddd}
.img img,.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(var(--gray));transition:filter var(--hover-ms)}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;background:hsl(var(--hue) 70% 72%);color:#333;font:14px/1.3 ui-monospace,Menlo,monospace}
.pola.active .img img,.pola.active .ph{filter:grayscale(0)}
.ov{position:absolute;inset:0;opacity:0;transition:opacity var(--hover-ms);background:linear-gradient(to top,rgba(255,255,255,var(--ov-strength)) 0%,rgba(255,255,255,0) var(--ov-height))}
.cap{position:absolute;left:0;right:0;bottom:var(--cap-bottom);margin:0;padding:0 16px;text-align:left;color:#000;font-size:var(--cap-size);line-height:1.15;font-weight:500;opacity:0;transition:opacity var(--hover-ms)}
.pola.active .ov{opacity:var(--ov-opacity)}
.pola.active .cap{opacity:1}

  /* ===== WORK SECTION ===== */
:root{
  --work-gap:18px;            /* 18px + ~102px of white under the hero tab ≈ 120px */
  --w-tab-size:24px; --w-tab-inactive:.45; --w-sticky-top:140px;
  --w-title-size:26px; --w-date-size:26px;
  --w-card-h:390px; --w-card-r:12px; --w-border:#BDBDBD;
  --w-row-gap:92px; --w-col-gap:58px; --w-dot:#A8DAFF;
}
.work{zoom:var(--k);width:1512px;margin-top:var(--work-gap);padding-bottom:160px}
.w-title{margin:0 0 36px 360px;font-size:var(--heading-size);font-weight:500;line-height:56px;color:#000}
.w-grid{display:grid;grid-template-columns:310px 1044px;margin-left:50px}

/* sticky side nav */
.w-side{position:sticky;top:var(--w-sticky-top);align-self:start;display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.w-tab{background:none;border:0;padding:0;font:inherit;font-size:var(--w-tab-size);line-height:40px;color:#000;opacity:var(--w-tab-inactive);cursor:pointer;text-align:left;transition:opacity .25s}
.w-tab.active{opacity:1}
.w-tab:hover{opacity:.8}

/* project rows: long, pair, long, pair... */
.w-list{display:flex;flex-direction:column;gap:var(--w-row-gap)}
.w-list.fade{animation:wfade .35s ease}
@keyframes wfade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.w-row{display:grid;gap:var(--w-col-gap)}
.w-row.long{grid-template-columns:1fr}
.w-row.pair{grid-template-columns:1fr 1fr}
.w-item{display:block;color:inherit;text-decoration:none}
.w-card{position:relative;height:var(--w-card-h);border:1px solid var(--w-border);border-radius:var(--w-card-r);overflow:hidden;background:#fff}
.w-card img{width:100%;height:100%;object-fit:cover;display:block}
.w-card picture{display:block;width:100%;height:100%}
.w-ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#4a76e8;background:rgba(169,228,252,.2);font:12px/1.3 ui-monospace,Menlo,monospace}
.w-meta{display:flex;align-items:flex-start;gap:12px;margin-top:16px}
.w-meta .dot{flex:none;width:18px;height:18px;margin-top:10px;border-radius:50%;background:var(--w-dot)}
.w-meta h3{flex:1;margin:0;font-size:var(--w-title-size);font-weight:400;line-height:40px;color:#000}
.w-meta .date{flex:none;width:144px;margin-top:4px;text-align:right;font-size:var(--w-date-size);font-weight:400;line-height:40px;color:#545454}
/* STUB SECTIONS (nav scroll targets) */
.stub{min-height:100vh;display:grid;place-items:center;color:#999;font-size:22px;border-top:1px dashed #ccc}
.mb{display:none}

  /* ===== MOBILE (class added by JS below 768px) — design canvas 402px wide ===== */
html.mobile{
  scroll-padding-top:calc(70px*var(--k));
  --nav-size:16px; --body-size:18px; --intro-b-size:18px; --caption-size:14px; --heading-size:28px; --cap-size:11px;
  --pad-t:5px; --pad-s:5px; --pad-b:24px; --img-r:6px; --frame-r:8px;
  --spread:1; --pola-scale:0.9; --cap-bottom:8px;
  --shadow-blur:8; --shadow-shift:5; --shadow-y:3;
  --ul-thickness:2px; --ul-gap:3px;
  --work-gap:54px; --w-sticky-top:70px; --w-tab-size:16px; --w-title-size:16px; --w-date-size:16px;
  --w-card-h:141px; --w-card-r:8px; --w-row-gap:40px; --w-col-gap:32px;
  --down:30;
}
/* nav */
.mobile .nav{height:calc(70px*var(--k))}
.mobile #nav{width:402px;height:70px;padding:30px 28px 0}
.mobile #nav a{height:23px;line-height:23px;width:calc(var(--nmw)*1px)}
.mobile #nav .d{display:none}
.mobile #nav .m{display:inline}
/* hero */
.mobile .hero-wrap{height:calc((670 + var(--down))*var(--k)*1px)}
.mobile .stage{width:402px;height:calc((740 + var(--down))*1px);transform:scale(var(--k)) translateY(-70px)}
.mobile .hero{top:70px;width:402px;height:calc((670 + var(--down))*1px)}
.mobile .tab{top:calc((656 + var(--down))*1px);width:402px;height:84px}
.mobile .dash{left:11px;top:calc((673 + var(--down))*1px);width:380px}
.mobile .note{left:84px;top:calc((317 + var(--down))*1px);width:97px;text-align:center}
.mobile .intro{left:4px;top:190px;width:394px;height:130px}
.mobile .track{height:390px;transform:translateY(calc(var(--i,0)*-130px))}
.mobile .panel{width:394px;height:130px}
.mobile .panel .hi{height:20px;line-height:20px}
.mobile .mb{display:inline}
.mobile .panel.b{padding:0 6px;align-items:center;text-align:left;line-height:24px}
.mobile .panel.b p + p{margin-top:6px}

/* slots + polaroids use the mobile coordinates */
.mobile .slot{left:calc(var(--mx)*1px);top:calc(var(--my)*1px);width:calc(var(--mw)*1px);height:calc(var(--mh)*1px)}
.mobile .slot.no-m{display:none}
.mobile .pola{--cx:calc(var(--mcx) + var(--nx,0));--cy:calc(var(--mcy) + var(--down));--w:var(--mw);--h:var(--mh);--r:var(--mr);--sx:var(--msx);--sy:var(--msy)}
.mobile .cap{padding:0 8px}
/* work */
.mobile .work{width:412px}
.mobile .w-title{margin:0 0 10px 40px;line-height:32px}
.mobile .w-grid{display:block;margin-left:0}
.mobile .w-side{flex-direction:row;justify-content:flex-start;align-items:center;gap:0;background:#fff;padding:12px 40px;z-index:20}
.mobile .w-tab{line-height:24px}
.mobile .w-div{display:block}
.mobile .w-list{padding:22px 40px 0}
.mobile .w-row.pair{grid-template-columns:1fr}
.mobile .w-meta{gap:8px;margin-top:8px}
.mobile .w-meta .dot{width:10px;height:10px;margin-top:5px}
.mobile .w-meta h3{line-height:20px}
.mobile .w-meta .date{width:89px;margin-top:2px;line-height:20px}
.mobile .pola.active{z-index:70}
</style>
</head>

    {src:"https://github.com/tanaya-kulkarni/Portfolio/blob/main/figmapic.jpeg?raw=true", caption:"Prototyping antics", cx:1191, cy:686, w:241, h:291, r:21, m:{cx:311,cy:616,w:127,h:148,r:21}}
  ]
};
/* ===== WORK SECTION DATA — add your links here ===== */
const WORK = {
  dx: [   // Digital Experiences (img = image link, link = project page, "" to skip)
    {title:"Exploring trust in Digital Banking with HDFC", date:"/ May 2026", img:"https://github.com/tanaya-kulkarni/Portfolio/blob/main/hdfccover.png?raw=true", imgM:"", link:""},
    {title:"Clique - Designing for Behavioral Influence",  date:"/ Sep 2026", img:"https://raw.githubusercontent.com/tanaya-kulkarni/Portfolio/e940a00b8ad03ce6fcebc62ad2ff1c052acb632f/cliquecover.svg", imgM:"https://github.com/tanaya-kulkarni/Portfolio/blob/main/cliquemobile.png?raw=true", link:""},
    {title:"Moveit - UX Design for Relocation Journeys",   date:"/ Feb 2026", img:"https://raw.githubusercontent.com/tanaya-kulkarni/Portfolio/3a8aa058891338da4049fbc0f602a17bba2a4a4c/moveitcover.svg", link:""},
    {title:"Foodin - Service Design in Food Courts",       date:"/ Apr 2026", img:"https://raw.githubusercontent.com/tanaya-kulkarni/Portfolio/d3f129735ef972ffc1294b37c5043fee378a0212/foodincover.svg", link:""}
  ],
  rs: [   // Research & Systems
    {title:"Research project one",   date:"/ Month 2026", img:"", link:""},
    {title:"Research project two",   date:"/ Month 2026", img:"", link:""},
    {title:"Research project three", date:"/ Month 2026", img:"", link:""},
    {title:"Research project four",  date:"/ Month 2026", img:"", link:""}
  ]
};
  
function workItem(p){
  const el = document.createElement(p.link ? 'a' : 'div');
  el.className = 'w-item';
  if(p.link) el.href = p.link;

  const media = p.img
    ? `<picture>
        ${p.imgM ? `<source media="(max-width:767px)" srcset="${p.imgM}">` : ''}
        <img src="${p.img}" alt="${p.title}" loading="lazy" decoding="async">
       </picture>`
    : `<span class="w-ph">Project image<br>add link in WORK</span>`;

  el.innerHTML = `
    <div class="w-card">${media}</div>
    <div class="w-meta">
      <span class="dot"></span>
      <h3>${p.title}</h3>
      <span class="date">${p.date}</span>
    </div>
  `;

  return el;
}

const wTabs = [...document.querySelectorAll('.w-tab')], wList = $('#w-list');
function renderWork(key){
  const items = WORK[key]; wList.innerHTML = '';
  let i = 0, long = true;                          // pattern: long, pair, long, pair...
  while(i < items.length){
    const n = long ? 1 : 2, row = document.createElement('div');
    row.className = 'w-row ' + (long ? 'long' : 'pair');
    items.slice(i, i + n).forEach(p => row.append(workItem(p)));
    wList.append(row); i += n; long = !long;
  }
  wTabs.forEach(t => t.classList.toggle('active', t.dataset.tab === key));
  wList.classList.remove('fade'); void wList.offsetWidth; wList.classList.add('fade');
}
wTabs.forEach(t => t.addEventListener('click', () => {
  renderWork(t.dataset.tab);
  const w = $('#work');
  if(w.getBoundingClientRect().top < 0) w.scrollIntoView({behavior:'smooth'});   // jump back to the top of the list
}));
renderWork('dx');

/* fit 1512px canvas to viewport width */
const mq = matchMedia('(max-width: 767px)');
const fit = () => {
  root.classList.toggle('mobile', mq.matches);
  root.style.setProperty('--k', innerWidth / (mq.matches ? 402 : 1512));
};
addEventListener('resize', fit); fit();

/* nav */
CONFIG.nav.forEach(n => { const a = document.createElement('a'); a.href = n.href;
  a.innerHTML = `<span><b class="d">${n.label}</b><b class="m">${n.short || n.label}</b></span>`;
  a.style.setProperty('--nw', n.w); a.style.setProperty('--nmw', n.mw || n.w); $('#nav').append(a); });
/* active nav underline: follows scroll and clicks */
const navLinks = [...document.querySelectorAll('#nav a')];
const hashes = navLinks.map(a => a.getAttribute('href')).filter(h => h.startsWith('#'));
const sections = hashes.map(h => document.querySelector(h)).filter(Boolean);
let lock = false;

const setActive = id => navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));

function spy(){
  if (lock || !sections.length) return;
  const line = (root.classList.contains('mobile') ? 70 : 100) * num('--k') + innerHeight * 0.4;    // trigger line below the nav
  let cur = sections[0];
  sections.forEach(s => { if (s.getBoundingClientRect().top <= line) cur = s; });
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) cur = sections[sections.length - 1];
  setActive(cur.id);
}
addEventListener('scroll', spy, {passive:true});
addEventListener('resize', spy);

navLinks.forEach(a => a.addEventListener('click', () => {
  const h = a.getAttribute('href');
  if (!h.startsWith('#')) return;                        // normal page links are skipped
  setActive(h.slice(1));
  lock = true;                                           // stops flicker during smooth scroll
  setTimeout(() => { lock = false; spy(); }, 900);
}));
spy();                                                   // HOME is active on load
/* slot helper (placeholder box, or image when src is set) */
function slot(o){
  const d = document.createElement('div'); d.className = 'slot';
  const m = o.m;                                   // mobile box; leave out to hide on mobile
  d.style.cssText = `--dx:${o.x};--dy:${o.y};--dw:${o.w};--dh:${o.h}` + (m ? `;--mx:${m.x};--my:${m.y};--mw:${m.w};--mh:${m.h}` : '');
  if(!m) d.classList.add('no-m');
  if(o.src){ const i = new Image(); i.src = o.src; i.alt = o.label; d.append(i); d.classList.add('filled'); }
  else d.innerHTML = `${o.label}<br>${o.w}×${o.h}`;
  return d;
}
CONFIG.illustrations.forEach(o => $('#illos').append(slot(o)));

/* intro panels: A (greeting + name) → B (bio) → A clone (seamless loop) */
function panelA(){
  const p = document.createElement('div'); p.className = 'panel';
  p.innerHTML = `<p class="hi">Hi there, I’m</p>`;
  p.append(slot({label:CONFIG.nameSvg.label, src:CONFIG.nameSvg.src, x:120, y:46, w:296, h:132, m:{x:102, y:30, w:189, h:72}}));
  return p;
}
const B = document.createElement('div'); B.className = 'panel b';
B.innerHTML = `<p>Currently studying<br class="mb"> Digital Product Design<br class="mb"> @BITS Design School.</p><p>Recently interned<br class="mb"> @Lemon Yellow</p>`;
$('#track').append(panelA(), B, panelA());

let step = 0;
const track = $('#track');
const advance = () => {
  step++;
  track.style.setProperty('--i', step);
  if (step === 2) {                      // reached the cloned first panel
    setTimeout(() => {                   // jump back to the start, no animation
      track.classList.add('no-anim');
      step = 0;
      track.style.setProperty('--i', 0);
      void track.offsetWidth;
      track.classList.remove('no-anim');
    }, num('--slide-ms') + 50);
  }
};
const loop = () => setTimeout(() => { advance(); loop(); }, num('--intro-interval'));
setTimeout(() => { advance(); loop(); }, num('--intro-delay'));

/* polaroids */
CONFIG.polaroids.forEach((p, i) => {
  const f = document.createElement('figure'); f.className = 'pola';
  const m = p.m || p;
  f.style.cssText = `--dcx:${p.cx};--dcy:${p.cy};--dw:${p.w};--dh:${p.h};--dr:${p.r};--dsx:${((p.cx-756)/756).toFixed(2)};--dsy:${((p.cy-560)/300).toFixed(2)};` +
    `--mcx:${m.cx};--mcy:${m.cy};--mw:${m.w};--mh:${m.h};--mr:${m.r};--msx:${((m.cx-201)/201).toFixed(2)};--msy:${((m.cy-540)/150).toFixed(2)};--hue:${190+i*18}`;
  const media = p.src ? `<img src="${p.src}" alt="${p.caption}">` : `<span class="ph">IMAGE ${i+1}<br>add link in CONFIG</span>`;
  f.innerHTML = `<div class="img">${media}<div class="ov"></div><p class="cap">${p.caption}</p></div>`;
  f.addEventListener('pointerenter', e => { if(e.pointerType === 'mouse') f.classList.add('active'); });
  f.addEventListener('pointerleave', e => { if(e.pointerType === 'mouse') f.classList.remove('active'); });
  f.addEventListener('pointerup', e => {
  if(e.pointerType === 'mouse') return;
  const was = f.classList.contains('active');
  document.querySelectorAll('.pola.active').forEach(x => x.classList.remove('active'));
  if(!was) f.classList.add('active');
});
  $('#polas').append(f);
});
document.addEventListener('pointerup', e => {
  if(e.pointerType !== 'mouse' && !e.target.closest('.pola'))
    document.querySelectorAll('.pola.active').forEach(x => x.classList.remove('active'));
});

function keepInside(){
  const mobile = root.classList.contains('mobile'), k = num('--k'), pad = 14;
  document.querySelectorAll('.pola').forEach(f => {
    f.style.removeProperty('--nx');
    if(!mobile) return;
    const r = f.getBoundingClientRect(); let dx = 0;
    if(r.left < pad) dx = (pad - r.left) / k;
    else if(r.right > innerWidth - pad) dx = -(r.right - (innerWidth - pad)) / k;
    if(dx) f.style.setProperty('--nx', dx.toFixed(1));
  });
}
keepInside();
addEventListener('resize', keepInside);
mq.addEventListener('change', keepInside);
/* DRAG HELPER — open the page with ?drag in mobile view, drag things, copy the numbers */
if (location.search.includes('drag')) {
  const box = document.createElement('pre');
  box.style.cssText = 'position:fixed;left:6px;right:6px;bottom:6px;z-index:999;max-height:35vh;overflow:auto;margin:0;padding:8px;background:#fff;border:1px solid #000;font:11px/1.4 monospace;white-space:pre-wrap';
  document.body.append(box);
  const n = (el, p) => parseFloat(el.style.getPropertyValue(p)) || 0;
  const report = () => {
    const pol = [...document.querySelectorAll('.pola')].map((f, i) =>
      `#${i+1} m:{cx:${Math.round(n(f,'--mcx') + n(f,'--nx'))},cy:${Math.round(n(f,'--mcy'))},w:${n(f,'--mw')},h:${n(f,'--mh')},r:${n(f,'--mr')}}`);
    const ill = [...document.querySelectorAll('#illos .slot:not(.no-m)')].map(s =>
      `${s.querySelector('img')?.alt || s.textContent.split('×')[0]}: x:${Math.round(n(s,'--mx'))},y:${Math.round(n(s,'--my'))}`);
    box.textContent = pol.join('\n') + '\n\n' + ill.join('\n');
  };
  document.querySelectorAll('.pola, #illos .slot:not(.no-m)').forEach(el => {
    const pola = el.classList.contains('pola'), kx = pola ? '--mcx' : '--mx', ky = pola ? '--mcy' : '--my';
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation(); el.setPointerCapture(e.pointerId);
      const k = num('--k'), x0 = e.clientX, y0 = e.clientY;
      const sx = n(el, kx) + (pola ? n(el, '--nx') : 0), sy = n(el, ky);
      el.style.removeProperty('--nx');
      const move = ev => { el.style.setProperty(kx, sx + (ev.clientX - x0) / k); el.style.setProperty(ky, sy + (ev.clientY - y0) / k); report(); };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', () => el.removeEventListener('pointermove', move), {once:true});
    });
  });
  report();
}
</script>
